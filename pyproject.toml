[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "finacial-futu"
version = "0.1.0"
description = "Gateway-free Futunn REST API client"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
keyring = ["SecretStorage>=3.3.3,<4"]

[tool.setuptools]
packages = ["broker"]
